# Inbox write path for the Post-it Board.
# Push a JSON command file to inbox/<name>.json on the `inbox` branch and this workflow
# applies it to Supabase (as the bot owner account), writes inbox/results/<name>.json,
# removes the command file and pushes the result back to `inbox`.
# Format: see inbox/README.md on the inbox branch (or the "Inbox" section of README.md).
#
# Keep this file identical on `main` and `inbox`: push events use the copy on `inbox`.
name: inbox

on:
  push:
    branches: [inbox]
    paths:
      - "inbox/*.json"           # top-level command files only
      - "!inbox/results/**"
  workflow_dispatch: {}          # manual re-run: processes any command files still waiting

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out inbox branch (command files)
        uses: actions/checkout@v4
        with:
          ref: inbox
          path: inbox-branch

      - name: Check out main (scripts — updates on main apply immediately)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process command files
        working-directory: inbox-branch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_OWNER_EMAIL: ${{ secrets.SUPABASE_OWNER_EMAIL }}
          SUPABASE_OWNER_PASSWORD: ${{ secrets.SUPABASE_OWNER_PASSWORD }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No command files waiting in inbox/."
            exit 0
          fi
          mkdir -p inbox/results
          names=(); failed=0
          echo "| file | status | message |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            result="inbox/results/$name"
            node ../main-branch/scripts/post.mjs --command-file "$f" --result-file "$result" > /dev/null
            code=$?
            status="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(r.status+"\t"+String(r.message).replace(/[|\n]/g," "))' "$result" 2>/dev/null || printf 'error\tno result written')"
            echo "$name -> ${status%%$'\t'*}"
            echo "| $name | ${status%%$'\t'*} | ${status#*$'\t'} |" >> "$GITHUB_STEP_SUMMARY"
            git add -- "$result" 2>/dev/null || true
            if [ $code -eq 0 ]; then
              git rm -q -- "$f"            # handled or skipped: remove the command
            else
              failed=1                     # real failure: keep the command so a re-run can retry it
            fi
            names+=("$name")
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -q -m "inbox: processed ${names[*]} [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push -q origin HEAD:inbox; then break; fi
              echo "Push rejected (attempt $attempt); rebasing on latest inbox…"
              git pull -q --rebase origin inbox || { git rebase --abort; sleep 3; }
              sleep $attempt
            done
          fi
          exit $failed
